<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="740" viewBox="0 0 1200 740" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333" />
    </marker>
    <style>
      .box { fill:#f8f9fb; stroke:#2b2f33; stroke-width:1.6; rx:6; ry:6 }
      .title { font: 700 16px/1.1 sans-serif; fill:#111 }
      .label { font: 14px/1.1 sans-serif; fill:#222 }
      .minor { font: 12px/1.0 sans-serif; fill:#444 }
      .arrow { stroke:#333; stroke-width:1.6; fill:none; marker-end:url(#arrow) }
      .storage { fill:#fff8e6; stroke:#b07400; stroke-width:1.4 }
    </style>
  </defs>

  <!-- User and Client -->
  <rect x="40" y="30" width="180" height="60" class="box" />
  <text x="130" y="55" text-anchor="middle" class="title">User / Client</text>
  <text x="130" y="74" text-anchor="middle" class="minor">Browser / API client</text>

  <!-- FastAPI -->
  <rect x="280" y="20" width="240" height="80" class="box" />
  <text x="400" y="45" text-anchor="middle" class="title">FastAPI (main.py)</text>
  <text x="400" y="66" text-anchor="middle" class="minor">CORS, app routing</text>

  <!-- Router / Endpoints -->
  <rect x="560" y="10" width="300" height="120" class="box" />
  <text x="710" y="34" text-anchor="middle" class="title">APIRouter (routes.py)</text>
  <text x="710" y="56" text-anchor="middle" class="label">/generate, /generate-images</text>
  <text x="710" y="74" text-anchor="middle" class="label">/describe-images, /images/*</text>

  <!-- Backend services -->
  <rect x="120" y="150" width="240" height="120" class="box" />
  <text x="240" y="180" text-anchor="middle" class="title">gemini_client.py</text>
  <text x="240" y="200" text-anchor="middle" class="minor">select_text_model, generate, describe_image</text>

  <rect x="420" y="150" width="240" height="120" class="box" />
  <text x="540" y="180" text-anchor="middle" class="title">image_generator.py</text>
  <text x="540" y="200" text-anchor="middle" class="minor">generate_paired_images</text>

  <rect x="720" y="150" width="240" height="120" class="box" />
  <text x="840" y="180" text-anchor="middle" class="title">parser.py</text>
  <text x="840" y="200" text-anchor="middle" class="minor">extract_three_stimuli, parse_sentences</text>

  <rect x="420" y="300" width="240" height="80" class="box" />
  <text x="540" y="335" text-anchor="middle" class="title">logger.py</text>
  <text x="540" y="353" text-anchor="middle" class="minor">session_scope, current_session</text>

  <!-- Storage -->
  <rect x="120" y="420" width="880" height="120" class="storage" rx="8" ry="8" />
  <text x="200" y="450" class="title">File system / Storage</text>
  <text x="200" y="470" class="minor">generated_images/, uploaded_images/, exports/, *.jsonl</text>

  <!-- Connections -->
  <path d="M220 60 L280 60" class="arrow" />
  <path d="M520 60 L560 60" class="arrow" />

  <!-- Router to backend services -->
  <path d="M680 130 L720 170" class="arrow" />
  <path d="M640 130 L540 150" class="arrow" />
  <path d="M720 130 L840 150" class="arrow" />

  <!-- User -> FastAPI label -->
  <text x="360" y="100" class="minor">HTTP POST / GET</text>

  <!-- FastAPI to Router -->
  <path d="M520 60 L560 60" class="arrow" />

  <!-- Router to gemini_client -->
  <path d="M680 120 L360 180" class="arrow" />
  <text x="520" y="145" class="minor" text-anchor="middle">calls generate / describe</text>

  <!-- Router to image_generator -->
  <path d="M700 120 L540 210" class="arrow" />
  <text x="650" y="220" class="minor">paired image pipeline</text>

  <!-- Router to parser -->
  <path d="M860 120 L840 150" class="arrow" />
  <text x="880" y="160" class="minor">parse & validate text</text>

  <!-- Parsers back to Router / Storage -->
  <path d="M840 270 L840 320 L560 360" class="arrow" />
  <text x="780" y="300" class="minor">validated stimuli</text>

  <!-- ImageGen to Storage -->
  <path d="M540 260 L540 420" class="arrow" />
  <text x="460" y="340" class="minor">save generated images</text>

  <!-- gemini_client to Storage (logs) -->
  <path d="M240 280 L240 420" class="arrow" />
  <text x="170" y="340" class="minor">append logs / metrics</text>

  <!-- Storage arrows to Router (serve files) -->
  <path d="M560 540 L560 480 L720 360" class="arrow" />
  <text x="700" y="460" class="minor">serve image / export</text>

  <!-- Describe images flow -->
  <path d="M680 120 L380 360" class="arrow" stroke-dasharray="6,4" />
  <text x="470" y="320" class="minor">upload -> saved -> describe_image (parallel)</text>

  <!-- Footer note -->
  <text x="40" y="720" class="minor">Notes: GEMINI_HARD_TIMEOUT_S, session logging, and paired image pipeline</text>
</svg>
