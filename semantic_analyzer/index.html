<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Semantic Abstraction Comparator</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=Syne+Mono&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<style>
:root {
  --ink:      #1a1917;
  --paper:    #f5f1eb;
  --dark:     #12110f;
  --card:     #1e1c19;
  --border:   #2e2b27;
  --muted:    #6b6760;
  --faint:    #3a3733;
  --gold:     #c8a84b;
  --teal:     #3eb89a;
  --coral:    #e05c4b;
  --dim-text: #a09d98;
  --mono: 'Syne Mono', monospace;
  --serif: 'Lora', serif;
  --display: 'Syne', sans-serif;
}

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

body {
  background: var(--dark);
  color: var(--paper);
  font-family: var(--display);
  font-size: 14px;
  min-height: 100vh;
}

/* ââ scanline texture ââ */
body::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:9999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.03) 2px, rgba(0,0,0,.03) 4px);
}

/* ââ top bar ââ */
.topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding: 18px 32px; border-bottom: 1px solid var(--border);
  position:sticky; top:0; z-index:100; background:var(--dark);
}
.logo {
  font-family:var(--display); font-size:13px; font-weight:800;
  letter-spacing:.15em; text-transform:uppercase; color:var(--paper);
}
.logo span { color:var(--gold); }
.status-pills { display:flex; gap:12px; }
.pill {
  display:inline-flex; align-items:center; gap:5px;
  font-family:var(--mono); font-size:10px; color:var(--muted);
  background:var(--card); border:1px solid var(--border);
  border-radius:3px; padding:4px 8px;
}
.dot { width:6px; height:6px; border-radius:50%; }
.dot.ok  { background:var(--teal);  box-shadow:0 0 5px var(--teal); }
.dot.err { background:var(--coral); }
.dot.off { background:var(--faint); }

/* ââ main layout ââ */
.main { display:grid; grid-template-columns:1fr; max-width:1400px; margin:0 auto; }

/* ââ input section ââ */
.input-section {
  padding: 40px 32px 32px;
  border-bottom: 1px solid var(--border);
}
.section-label {
  font-family:var(--mono); font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--muted); margin-bottom:24px;
}
.text-inputs {
  display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;
}
.input-block label {
  display:block; font-family:var(--mono); font-size:10px;
  letter-spacing:.14em; text-transform:uppercase; margin-bottom:8px;
}
.label-a { color:var(--teal); }
.label-b { color:var(--coral); }

textarea {
  width:100%; background:var(--card); border:1px solid var(--border);
  border-radius:6px; color:var(--paper); font-family:var(--serif);
  font-size:13px; line-height:1.75; padding:16px; resize:vertical;
  min-height:180px; outline:none; transition:border-color .2s;
}
textarea.ta:focus { border-color:var(--teal); }
textarea.tb:focus { border-color:var(--coral); }
textarea::placeholder { color:var(--faint); font-style:italic; }

.controls {
  display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap;
}
.ctrl-group { display:flex; flex-direction:column; gap:6px; }
.ctrl-group label {
  font-family:var(--mono); font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted);
}
input[type=text] {
  background:var(--card); border:1px solid var(--border); border-radius:5px;
  color:var(--paper); font-family:var(--mono); font-size:12px;
  padding:9px 14px; outline:none; width:200px; transition:border-color .2s;
}
input[type=text]:focus { border-color:var(--gold); }

select {
  background:var(--card); border:1px solid var(--border); border-radius:5px;
  color:var(--paper); font-family:var(--mono); font-size:12px;
  padding:9px 14px; outline:none; transition:border-color .2s;
  cursor:pointer;
}
select:focus { border-color:var(--gold); }
select:hover { border-color:var(--gold); }

.run-btn {
  background:var(--gold); color:var(--dark); border:none; border-radius:5px;
  padding:10px 28px; font-family:var(--display); font-size:13px; font-weight:700;
  letter-spacing:.06em; cursor:pointer; transition:all .15s; white-space:nowrap;
  align-self:flex-end;
}
.run-btn:hover { background:#d9b85a; }
.run-btn:active { transform:scale(.97); }
.run-btn:disabled { background:var(--faint); color:var(--muted); cursor:not-allowed; transform:none; }

/* ââ error ââ */
.error-box {
  display:none; background:rgba(224,92,75,.08); border:1px solid rgba(224,92,75,.3);
  border-radius:6px; padding:12px 16px; font-family:var(--mono); font-size:12px;
  color:var(--coral); margin:20px 32px 0;
}

/* ââ results ââ */
#results { display:none; padding:40px 32px 80px; }

/* summary cards */
.summary {
  display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
  gap:12px; margin-bottom:40px;
}
.scard {
  background:var(--card); border:1px solid var(--border); border-radius:8px;
  padding:16px 20px;
}
.scard-label {
  font-family:var(--mono); font-size:9px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); margin-bottom:6px;
}
.scard-val {
  font-family:var(--display); font-size:26px; font-weight:800; line-height:1;
}
.scard-val.a { color:var(--teal); }
.scard-val.b { color:var(--coral); }
.scard-val.d { color:var(--gold); }

.mat-notice {
  font-family:var(--mono); font-size:11px; color:var(--gold);
  background:rgba(200,168,75,.07); border:1px solid rgba(200,168,75,.2);
  border-radius:4px; padding:8px 14px; margin-bottom:32px; word-break:break-all;
}

/* ── paired t-test panel ── */
.ttest-panel {
  background:var(--card); border:1px solid var(--border);
  border-radius:10px; padding:24px 28px; margin-bottom:32px;
}
.ttest-title {
  font-family:var(--mono); font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--muted); margin-bottom:12px;
}
.ttest-headline {
  font-family:var(--display); font-size:18px; font-weight:700;
  margin-bottom:18px; line-height:1.4;
}
.ttest-headline.sig    { color:var(--teal); }
.ttest-headline.ns     { color:var(--dim-text); }
.ttest-headline.weak   { color:var(--gold); }
.ttest-grid {
  display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
  gap:14px;
}
.ttest-cell {
  border-left:2px solid var(--faint); padding-left:12px;
}
.ttest-cell-label {
  font-family:var(--mono); font-size:9px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); margin-bottom:4px;
}
.ttest-cell-val {
  font-family:var(--mono); font-size:15px; font-weight:600; color:var(--paper);
}
.ttest-cell-val.pos { color:var(--teal); }
.ttest-cell-val.neg { color:var(--coral); }
.ttest-formula {
  font-family:var(--mono); font-size:11px; color:var(--dim-text);
  margin-top:14px; padding-top:14px; border-top:1px solid var(--faint);
}

/* ââ comparison table ââ */
.col-heads {
  display:grid; grid-template-columns: 120px 1fr 64px 20px 1fr 64px 80px;
  gap:0; padding:0 0 8px;
  font-family:var(--mono); font-size:9px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted);
  border-bottom:1px solid var(--border); margin-bottom:8px;
}
.col-heads .ca { color:var(--teal); }
.col-heads .cb { color:var(--coral); }
.col-heads .right { text-align:right; }

.pair-row {
  display:grid;
  grid-template-columns: 120px 1fr 64px 20px 1fr 64px 80px;
  gap:0; align-items:center;
  padding:10px 0; border-bottom:1px solid rgba(255,255,255,.04);
  transition:background .12s;
}
.pair-row:hover { background:rgba(255,255,255,.02); border-radius:4px; }
.pair-row.oov-both { opacity:.45; }

/* slot badge */
.slot-badge {
  font-family:var(--mono); font-size:10px; color:var(--muted);
  background:var(--faint); border-radius:3px; padding:2px 6px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:110px; display:inline-block;
}

/* noun cell */
.noun-cell { padding:0 10px; }
.noun-word {
  font-family:var(--serif); font-size:15px; font-weight:500;
  color:var(--paper); display:block; margin-bottom:4px;
}
.noun-word.abstract { color:var(--teal); }
.noun-word.concrete { color:var(--coral); }
.bar-wrap { height:4px; background:var(--faint); border-radius:2px; overflow:hidden; }
.bar-fill { height:100%; border-radius:2px; transition:width .7s cubic-bezier(.4,0,.2,1); }
.bar-a { background:var(--teal); }
.bar-b { background:var(--coral); }

/* score */
.score-cell {
  font-family:var(--mono); font-size:13px; font-weight:500; text-align:right;
  padding-right:8px;
}
.score-a { color:var(--teal); }
.score-b { color:var(--coral); }

/* vs divider */
.vs {
  text-align:center; font-family:var(--mono); font-size:9px;
  color:var(--faint); letter-spacing:.1em;
}

/* delta */
.delta-cell {
  text-align:right; font-family:var(--mono); font-size:12px; padding-right:4px;
}
.delta-pos  { color:var(--teal);  }
.delta-neg  { color:var(--coral); }
.delta-zero { color:var(--muted); }

/* WN badge */
.wn-tag {
  display:inline-block; font-family:var(--mono); font-size:9px;
  border-radius:2px; padding:1px 4px; margin-left:4px; vertical-align:middle;
}
.wn-yes { color:var(--teal);  border:1px solid rgba(62,184,154,.35); }
.wn-no  { color:var(--faint); border:1px solid var(--faint); }

/* spinner */
.spinner {
  display:inline-block; width:13px; height:13px;
  border:2px solid var(--faint); border-top-color:var(--gold);
  border-radius:50%; animation:spin .65s linear infinite; vertical-align:middle;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* empty / oov labels */
.null-noun { font-family:var(--mono); font-size:11px; color:var(--faint); font-style:italic; }

/* general-mode noun row */
.gen-noun-row {
  display:grid; grid-template-columns: 1fr 60px 80px;
  gap:12px; align-items:center;
  padding:8px 12px; border-bottom:1px solid rgba(255,255,255,.04);
  font-family:var(--serif); font-size:14px;
}
.gen-noun-row:hover { background:rgba(255,255,255,.02); border-radius:4px; }
.gen-noun-row.oov { opacity:.55; }
.gen-noun-name { color:var(--paper); }
.gen-noun-name.abstract { color:var(--teal); }
.gen-noun-name.concrete { color:var(--coral); }
.gen-noun-al {
  font-family:var(--mono); font-size:12px; text-align:right; color:var(--dim-text);
}
.gen-noun-tag {
  font-family:var(--mono); font-size:9px; text-align:right;
}

@media (max-width:900px) {
  .text-inputs { grid-template-columns:1fr; }
  .col-heads, .pair-row {
    grid-template-columns: 90px 1fr 52px 16px 1fr 52px 60px;
  }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">Semantic<span>AL</span> · Comparator</div>
  <div class="status-pills">
    <span class="pill"><span class="dot" id="ds"></span><span id="ls">spaCy</span></span>
    <span class="pill"><span class="dot" id="dn"></span><span id="ln">WordNet</span></span>
    <span class="pill"><span class="dot" id="dc"></span><span id="lc">Analyzer</span></span>
  </div>
</header>

<div class="main">

  <section class="input-section">
    <div class="section-label">Input – two parallel texts (same template, different abstraction)</div>
    <div class="text-inputs">
      <div class="input-block">
        <label class="label-a">Text A – Abstract version (NC)</label>
        <textarea class="ta" id="ta" placeholder="Transports can integrate supportive structures and propulsive systems to create adaptable conveyances…"></textarea>
      </div>
      <div class="input-block">
        <label class="label-b">Text B – Concrete version (VC)</label>
        <textarea class="tb" id="tb" placeholder="Bikes can integrate plastic pontoons and bicycle chains to create cheap bikes for asphalt roads…"></textarea>
      </div>
    </div>
    <div class="controls">
      <div class="ctrl-group">
        <label>Label / filename</label>
        <input type="text" id="label-in" value="comparison" placeholder="my_comparison"/>
      </div>
      <div class="ctrl-group">
        <label>Abstraction Formula</label>
        <select id="formula-select">
          <option value="wordnet_min">WordNet (shortest path) — most abstract sense</option>
          <option value="wordnet_mean">WordNet (mean path) — ontological position</option>
          <option value="brysbaert">Brysbaert Concreteness Index — psycholinguistic ratings</option>
        </select>
      </div>
      <button class="run-btn" id="run-btn" onclick="run()">Analyze Nouns (Aligned) →</button>
      <button class="run-btn" id="run-general-btn" onclick="runGeneral()" style="background:transparent;color:var(--paper);border:1px solid var(--border)">Compare General →</button>
    </div>
  </section>

  <div class="error-box" id="err"></div>

  <!-- ââ Results (aligned mode) ââ -->
  <section id="results">

    <div class="summary" id="summary-cards"></div>
    <div class="ttest-panel" id="ttest-panel" style="display:none"></div>
    <div class="mat-notice" id="mat-notice"></div>

    <div class="col-heads">
      <span>slot</span>
      <span class="ca">phrase – text a (nouns)</span>
      <span class="ca right">avg AL (a)</span>
      <span></span>
      <span class="cb">phrase – text b (nouns)</span>
      <span class="cb right">avg AL (b)</span>
      <span class="right">delta</span>
    </div>

    <div id="pair-list"></div>

  </section>

  <!-- ââ Results (general mode) ââ -->
  <section id="results-general" style="display:none; padding:40px 32px 80px;">

    <div class="summary" id="summary-cards-general"></div>
    <div class="ttest-panel" id="ttest-panel-general" style="display:none"></div>
    <div class="mat-notice" id="mat-notice-general"></div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">
      <div>
        <div class="section-label" style="color:var(--teal); margin-bottom:14px">text a — all nouns</div>
        <div id="general-list-a"></div>
      </div>
      <div>
        <div class="section-label" style="color:var(--coral); margin-bottom:14px">text b — all nouns</div>
        <div id="general-list-b"></div>
      </div>
    </div>

  </section>

</div><!-- /main -->

<script>
/* ââ status ââ */
async function loadStatus() {
  try {
    const d = await (await fetch('/status')).json();
    dot('s', d.spacy  === true || d.spacy  === 'ok' || (typeof d.spacy  === 'string' && !d.spacy.startsWith('ERROR'))  ? 'ok' : 'err', 'spaCy');
    dot('n', d.nltk   === true || d.nltk   === 'ok' || (typeof d.nltk   === 'string' && !d.nltk.startsWith('ERROR'))   ? 'ok' : 'err', 'WordNet');
    dot('c', d.analyzer ? 'ok' : 'err', d.analyzer ? 'Analyzer ✓' : 'Analyzer (error)');
  } catch { ['s','n','c'].forEach(k => dot(k,'err',k)); }
}
function dot(id, cls, lbl) {
  document.getElementById('d'+id).className = 'dot '+cls;
  document.getElementById('l'+id).textContent = lbl;
}

/* ââ helpers ââ */
function fmt(v) { return v !== null && v !== undefined ? v.toFixed(3) : '–'; }
function pct(v) { return v !== null && v !== undefined ? (v*100).toFixed(1) : '0'; }

function wnTag(ok) {
  return `<span class="wn-tag ${ok ? 'wn-yes':'wn-no'}">${ok?'WN':'OOV'}</span>`;
}

function nounClass(al) {
  if (al === null) return '';
  return al >= 0.55 ? 'abstract' : 'concrete';
}

function renderTTest(t) {
  const panel = document.getElementById('ttest-panel');
  if (!t) { panel.style.display = 'none'; return; }

  if (t.n < 2 || t.t_statistic === null) {
    panel.style.display = 'block';
    panel.innerHTML = `
      <div class="ttest-title">Paired t-test (NC vs VC abstraction)</div>
      <div class="ttest-headline ns">Insufficient data — need ≥ 2 paired slots with WordNet scores. (n=${t.n}, excluded=${t.n_excluded})</div>
    `;
    return;
  }

  let cls = 'ns';
  if (t.p_value < 0.05) cls = 'sig';
  else if (t.p_value < 0.1) cls = 'weak';

  const fmtP = t.p_value < 0.0001 ? '< 0.0001' : t.p_value.toExponential(3);
  const meanCls = t.mean_diff > 0 ? 'pos' : (t.mean_diff < 0 ? 'neg' : '');
  const tCls    = t.t_statistic > 0 ? 'pos' : (t.t_statistic < 0 ? 'neg' : '');

  panel.style.display = 'block';
  panel.innerHTML = `
    <div class="ttest-title">Paired t-test (NC vs VC abstraction, slot-by-slot)</div>
    <div class="ttest-headline ${cls}">${t.interpretation}</div>
    <div class="ttest-grid">
      <div class="ttest-cell">
        <div class="ttest-cell-label">n (paired slots)</div>
        <div class="ttest-cell-val">${t.n}</div>
      </div>
      <div class="ttest-cell">
        <div class="ttest-cell-label">df</div>
        <div class="ttest-cell-val">${t.df}</div>
      </div>
      <div class="ttest-cell">
        <div class="ttest-cell-label">t-statistic</div>
        <div class="ttest-cell-val ${tCls}">${t.t_statistic.toFixed(4)}</div>
      </div>
      <div class="ttest-cell">
        <div class="ttest-cell-label">p-value</div>
        <div class="ttest-cell-val">${fmtP}</div>
      </div>
      <div class="ttest-cell">
        <div class="ttest-cell-label">mean diff (a − b)</div>
        <div class="ttest-cell-val ${meanCls}">${t.mean_diff > 0 ? '+' : ''}${t.mean_diff.toFixed(4)}</div>
      </div>
      <div class="ttest-cell">
        <div class="ttest-cell-label">SD of diffs</div>
        <div class="ttest-cell-val">${t.std_diff.toFixed(4)}</div>
      </div>
      <div class="ttest-cell">
        <div class="ttest-cell-label">95% CI</div>
        <div class="ttest-cell-val">[${t.ci95_low.toFixed(3)}, ${t.ci95_high.toFixed(3)}]</div>
      </div>
      <div class="ttest-cell">
        <div class="ttest-cell-label">excluded (OOV)</div>
        <div class="ttest-cell-val">${t.n_excluded}</div>
      </div>
    </div>
    <div class="ttest-formula">scipy.stats.ttest_rel(NC_AL, VC_AL) over the ${t.n} paired slots where both NC and VC nouns have WordNet entries</div>
  `;
}

/* ââ main run ââ */
async function run() {
  const ta      = document.getElementById('ta').value.trim();
  const tb      = document.getElementById('tb').value.trim();
  const lbl     = document.getElementById('label-in').value.trim() || 'comparison';
  const formula = document.getElementById('formula-select').value || 'wordnet_min';
  if (!ta || !tb) { showErr('Please fill in both texts.'); return; }

  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Extracting nouns…';
  document.getElementById('err').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('results-general').style.display = 'none';

  try {
    const res = await fetch('/compare', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text_a:ta, text_b:tb, label:lbl, formula:formula }),
    });
    const d = await res.json();
    if (!res.ok) { showErr(d.detail || d.error || JSON.stringify(d)); return; }
    render(d);
  } catch(e) { showErr(e.message); }
  finally {
    btn.disabled = false;
    btn.textContent = 'Analyze Nouns (Aligned) →';
  }
}

function render(d) {
  /* summary cards */
  const cards = document.getElementById('summary-cards');
  const wcA = d.word_count_a ?? 0;
  const wcB = d.word_count_b ?? 0;
  const wcDelta = wcA - wcB;
  const wcDeltaStr = (wcDelta > 0 ? '+' : '') + wcDelta;
  const wcDeltaColor = wcDelta === 0 ? 'var(--teal)' : 'var(--coral)';

  cards.innerHTML = `
    <div class="scard"><div class="scard-label">word count – text a</div><div class="scard-val a">${wcA}</div></div>
    <div class="scard"><div class="scard-label">word count – text b</div><div class="scard-val b">${wcB}</div></div>
    <div class="scard"><div class="scard-label">word count Δ (a − b)</div><div class="scard-val" style="color:${wcDeltaColor}">${wcDeltaStr}</div></div>
    <div class="scard"><div class="scard-label">avg AL – text a</div><div class="scard-val a">${fmt(d.avg_al_a)}</div></div>
    <div class="scard"><div class="scard-label">avg AL – text b</div><div class="scard-val b">${fmt(d.avg_al_b)}</div></div>
    <div class="scard"><div class="scard-label">noun count (a)</div><div class="scard-val d">${d.noun_count_a}</div></div>
    <div class="scard"><div class="scard-label">noun count (b)</div><div class="scard-val" style="color:var(--paper)">${d.noun_count_b}</div></div>
    <div class="scard"><div class="scard-label">in WordNet (a / b)</div><div class="scard-val" style="color:var(--dim-text);font-size:20px">
      ${d.slots.reduce((s,x)=>s+x.wn_a,0)} / ${d.slots.reduce((s,x)=>s+x.wn_b,0)}
    </div></div>
  `;

  /* paired t-test panel */
  renderTTest(d.ttest);

  // Format formula name for display
  let formulaLabel = d.formula;
  if (d.formula === 'wordnet_min') formulaLabel = 'WordNet (shortest path)';
  else if (d.formula === 'wordnet_mean') formulaLabel = 'WordNet (mean path)';
  else if (d.formula === 'brysbaert') formulaLabel = 'Brysbaert Concreteness Index';
  
  document.getElementById('mat-notice').innerHTML = `✓  saved → ${d.mat_file}<br><span style="font-family:var(--mono);font-size:10px;color:var(--dim-text);margin-top:4px;display:inline-block">formula: <em>${formulaLabel}</em></span>`;

  /* pair rows */
  const list = document.getElementById('pair-list');
  list.innerHTML = '';

  for (const slot of d.slots) {
    const a = slot.phrase_a ? {
      phrase: slot.phrase_a,
      nouns: slot.nouns_a || [],
      al: slot.avg_al_a,
    } : null;
    const b = slot.phrase_b ? {
      phrase: slot.phrase_b,
      nouns: slot.nouns_b || [],
      al: slot.avg_al_b,
    } : null;
    const row = document.createElement('div');
    const bothOov = slot.wn_a === 0 && slot.wn_b === 0;
    row.className = 'pair-row' + (bothOov ? ' oov-both' : '');

    const nA = a
      ? `<span class="noun-word ${nounClass(a.al)}">${a.phrase}${wnTag(slot.wn_a > 0)}</span>
         <div style="font-family:var(--mono);font-size:10px;color:var(--dim-text);margin-top:4px">${a.nouns.join(', ')}</div>
         <div class="bar-wrap"><div class="bar-fill bar-a" style="width:0%" data-pct="${pct(a.al)}"></div></div>`
      : `<span class="null-noun">–</span>`;

    const nB = b
      ? `<span class="noun-word ${nounClass(b.al)}">${b.phrase}${wnTag(slot.wn_b > 0)}</span>
         <div style="font-family:var(--mono);font-size:10px;color:var(--dim-text);margin-top:4px">${b.nouns.join(', ')}</div>
         <div class="bar-wrap"><div class="bar-fill bar-b" style="width:0%" data-pct="${pct(b.al)}"></div></div>`
      : `<span class="null-noun">–</span>`;

    row.innerHTML = `
      <div><span class="slot-badge" title="template slot">${slot.slot}</span></div>
      <div class="noun-cell">${nA}</div>
      <div class="score-cell score-a">${fmt(a ? a.al : null)}</div>
      <div class="vs">|</div>
      <div class="noun-cell">${nB}</div>
      <div class="score-cell score-b">${fmt(b ? b.al : null)}</div>
      <div class="delta-cell delta-zero">${slot.delta !== null && slot.delta !== undefined ? (slot.delta >= 0 ? '+' : '') + slot.delta.toFixed(3) : '–'}</div>
    `;
    list.appendChild(row);
  }

  document.getElementById('results').style.display = 'block';

  /* animate bars */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.bar-fill[data-pct]').forEach(b => {
      b.style.width = b.dataset.pct + '%';
    });
  }));
}

function showErr(msg) {
  const b = document.getElementById('err');
  b.textContent = '✗   ' + msg;
  b.style.display = 'block';
}

/* ─── General Comparison ─── */
async function runGeneral() {
  const ta      = document.getElementById('ta').value.trim();
  const tb      = document.getElementById('tb').value.trim();
  const lbl     = document.getElementById('label-in').value.trim() || 'comparison';
  const formula = document.getElementById('formula-select').value || 'wordnet_min';
  if (!ta || !tb) { showErr('Please fill in both texts.'); return; }

  const btn = document.getElementById('run-general-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Extracting nouns…';
  document.getElementById('err').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('results-general').style.display = 'none';

  try {
    const res = await fetch('/compare-general', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text_a:ta, text_b:tb, label:lbl, formula:formula }),
    });
    const d = await res.json();
    if (!res.ok) { showErr(d.detail || d.error || JSON.stringify(d)); return; }
    renderGeneral(d);
  } catch(e) { showErr(e.message); }
  finally {
    btn.disabled = false;
    btn.textContent = 'Compare General →';
  }
}

function renderGeneral(d) {
  const ta = d.text_a, tb = d.text_b, t = d.ttest;

  // Summary cards
  const cards = document.getElementById('summary-cards-general');
  cards.innerHTML = `
    <div class="scard"><div class="scard-label">word count – text a</div><div class="scard-val a">${ta.word_count}</div></div>
    <div class="scard"><div class="scard-label">word count – text b</div><div class="scard-val b">${tb.word_count}</div></div>
    <div class="scard"><div class="scard-label">noun count (a)</div><div class="scard-val a">${ta.noun_count}</div></div>
    <div class="scard"><div class="scard-label">noun count (b)</div><div class="scard-val b">${tb.noun_count}</div></div>
    <div class="scard"><div class="scard-label">avg AL – text a</div><div class="scard-val a">${fmt(ta.avg_al)}</div></div>
    <div class="scard"><div class="scard-label">avg AL – text b</div><div class="scard-val b">${fmt(tb.avg_al)}</div></div>
    <div class="scard"><div class="scard-label">in WordNet (a / b)</div><div class="scard-val" style="color:var(--dim-text);font-size:20px">${ta.wn_count} / ${tb.wn_count}</div></div>
  `;

  // Independent t-test panel
  renderIndepTTest(t);

  // Format formula name for display
  let formulaLabel = d.formula;
  if (d.formula === 'wordnet_min') formulaLabel = 'WordNet (shortest path)';
  else if (d.formula === 'wordnet_mean') formulaLabel = 'WordNet (mean path)';
  else if (d.formula === 'brysbaert') formulaLabel = 'Brysbaert Concreteness Index';
  
  document.getElementById('mat-notice-general').innerHTML = `✓  saved → ${d.mat_file}<br><span style="font-family:var(--mono);font-size:10px;color:var(--dim-text);margin-top:4px;display:inline-block">formula: <em>${formulaLabel}</em></span>`;

  // Side-by-side noun lists
  const fillList = (id, side) => {
    const el = document.getElementById(id);
    el.innerHTML = side.nouns.map(n => {
      const cls = n.al === null ? '' : (n.al >= 0.55 ? 'abstract' : 'concrete');
      const al  = n.al === null ? '–' : n.al.toFixed(3);
      const tag = n.in_wordnet
        ? '<span class="wn-tag wn-yes">WN</span>'
        : '<span class="wn-tag wn-no">OOV</span>';
      return `<div class="gen-noun-row ${n.in_wordnet?'':'oov'}">
                <span class="gen-noun-name ${cls}">${n.noun}</span>
                <span class="gen-noun-al">${al}</span>
                <span class="gen-noun-tag">${tag}</span>
              </div>`;
    }).join('') || '<div class="null-noun">No nouns extracted.</div>';
  };
  fillList('general-list-a', ta);
  fillList('general-list-b', tb);

  document.getElementById('results-general').style.display = 'block';
}

function renderIndepTTest(t) {
  const panel = document.getElementById('ttest-panel-general');
  if (!t) { panel.style.display = 'none'; return; }

  if (t.t_statistic === null) {
    panel.style.display = 'block';
    panel.innerHTML = `
      <div class="ttest-title">Independent-samples t-test (Welch's)</div>
      <div class="ttest-headline ns">Insufficient data — need ≥ 2 nouns with WordNet scores in each text. (n_a=${t.n_a}, n_b=${t.n_b})</div>
    `;
    return;
  }

  let cls = 'ns';
  if (t.p_value < 0.05) cls = 'sig';
  else if (t.p_value < 0.1) cls = 'weak';

  const fmtP = t.p_value < 0.0001 ? '< 0.0001' : t.p_value.toExponential(3);
  const meanCls = t.mean_diff > 0 ? 'pos' : (t.mean_diff < 0 ? 'neg' : '');
  const tCls    = t.t_statistic > 0 ? 'pos' : (t.t_statistic < 0 ? 'neg' : '');

  panel.style.display = 'block';
  panel.innerHTML = `
    <div class="ttest-title">Independent-samples t-test (Welch's, all-noun AL)</div>
    <div class="ttest-headline ${cls}">${t.interpretation}</div>
    <div class="ttest-grid">
      <div class="ttest-cell">
        <div class="ttest-cell-label">n (a / b)</div>
        <div class="ttest-cell-val">${t.n_a} / ${t.n_b}</div>
      </div>
      <div class="ttest-cell">
        <div class="ttest-cell-label">df (Welch)</div>
        <div class="ttest-cell-val">${t.df}</div>
      </div>
      <div class="ttest-cell">
        <div class="ttest-cell-label">t-statistic</div>
        <div class="ttest-cell-val ${tCls}">${t.t_statistic.toFixed(4)}</div>
      </div>
      <div class="ttest-cell">
        <div class="ttest-cell-label">p-value</div>
        <div class="ttest-cell-val">${fmtP}</div>
      </div>
      <div class="ttest-cell">
        <div class="ttest-cell-label">mean AL (a)</div>
        <div class="ttest-cell-val">${t.mean_a.toFixed(4)}</div>
      </div>
      <div class="ttest-cell">
        <div class="ttest-cell-label">mean AL (b)</div>
        <div class="ttest-cell-val">${t.mean_b.toFixed(4)}</div>
      </div>
      <div class="ttest-cell">
        <div class="ttest-cell-label">mean diff</div>
        <div class="ttest-cell-val ${meanCls}">${t.mean_diff > 0 ? '+' : ''}${t.mean_diff.toFixed(4)}</div>
      </div>
    </div>
    <div class="ttest-formula">scipy.stats.ttest_ind(NC_AL, VC_AL, equal_var=False) — for unrelated texts of any length.</div>
  `;
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key==='Enter') run();
});

/* ââ auto-populate from URL params ââ */
function loadUrlParams() {
  const params = new URLSearchParams(window.location.search);
  const ta = params.get('ta');
  const tb = params.get('tb');
  const label = params.get('label');
  if (ta) document.getElementById('ta').value = decodeURIComponent(ta);
  if (tb) document.getElementById('tb').value = decodeURIComponent(tb);
  if (label) document.getElementById('label-in').value = decodeURIComponent(label);
}

loadStatus();
loadUrlParams();
</script>
